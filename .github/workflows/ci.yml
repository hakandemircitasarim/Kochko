name: CI

# The first automated safety net for KOCHKO. Runs on every push/PR so the highest-stakes
# code — crisis/ED/allergen guardrails, the edge functions tsc never type-checked, and the
# architecture invariants — can no longer silently rot between manual audit rounds.
on:
  push:
    branches: [claude/KOCHKO, main]
  pull_request:

jobs:
  client:
    name: Client (tsc + arch-guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check client (tsc --noEmit)
        run: npm run lint
      - name: Architecture invariants (G1-G5)
        run: npm run arch-guards
      # Seam symmetry + ratchet: every writer has a reader and every reader has a writer, or the
      # asymmetry is declared in scripts/seams.manifest.json with a finding id and an owner. The
      # declared-debt count may shrink, never grow — so "declare it to go green" fails the ratchet.
      # This is the mechanical answer to the repo's most common defect class (inert-wiring, 23% of
      # the 2026-07-25 brain audit). See AI_BEYIN_2026-07-25.md §7 F0/B6'.
      - name: Seam symmetry + debt ratchet
        run: npm run seam-check

  edge:
    name: Edge (deno check + guardrail tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions (tsc excludes supabase/functions — this is the only net)
        run: npm run check:edge
      - name: Safety-critical guardrail unit tests
        run: npm run test:edge
